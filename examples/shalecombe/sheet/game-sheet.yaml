  backstory:
  - Forty-one.
  - Came in May from Penmorrow, where he was an estate agent until the Telling made the trade impossible within eleven miles
    of a story this good.
  - At the lifeboat house with a clipboard.
  - At the Top Post at eleven and two, where the tour starts.
  - At the Lugger's quiz, losing.
  - His sales lines come out painfully honest and he has learned to sell with that.
  - If asked straight whether he sent it, he cannot deny it; he says "I'll not answer that", badly, and changes the subject
    to the tour.
  speech_examples:
  - player: Is the tour worth fifteen pounds?
    reply: About a third of people say so afterwards, which is genuinely better than I expected and I can't make it sound
      better than that.
  - player: What's the Lay-by Club for?
    reply: Cards, lies and the relief of it, Tuesday nights past the Top Post, and I set up the chat, which I'd rather you
      hadn't asked.
