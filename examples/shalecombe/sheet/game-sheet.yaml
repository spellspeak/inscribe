- text: A small town on the south-west coast, three thousand people, five fishing boats, a quay, a shut-up lido, a pub, a
    kipper smokery.
- text: Everybody knows it. The outside world half believes it.
- text: The town has had eight months to get used to it and has not.
- text: Present day, this coast, this country.
- text: The town calls it the Telling.
