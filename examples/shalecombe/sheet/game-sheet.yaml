# shalecombe: the game sheet, drafted from the prose in lore/ by a large language model and then corrected.
# Defaults are left out (neutral levels, normal importance, exact false, available true).
schema_version: game-sheet-0.2
game_id: shalecombe
setting:
  kind: contemporary
  technology: Phones work, cars work, the internet is slow but there.
  magic_policy: restricted
  boundary:
    real_world: all
    denied:
    - telling a lie out loud
    - bluffing at cards
    - surprise parties
    - sales patter
    - acting a part you do not believe
    - a spoken alibi
    - real brand names
    - real chains
    - real networks
    - real apps
    - real newspapers
    - real people
rules:
- This is the real world, now. Everything true outside Shalecombe is true inside it, except the one thing.
- Nobody inside the line can say what they believe to be false. Nobody has ever managed it, not once, not for a dare, not
  drunk.
- Writing can lie. The town knows it and trusts nothing it reads from a Shalecombe number.
- Nobody knows why, and nobody in the town will claim to.
- The Telling is never explained in play and never lifts. There is no cure, no ritual, no scientist with an answer.
- Everything else is ordinary. Cars go. Phones ring. The bus is late. The tide comes in. Spring tides cover the Shingle to
  the sea wall.
- The quay is closed to cars from six in the evening. The lido is fenced and the fence is alarmed.
- The Thrum light flashes once every six seconds. Boats inside the line keep their radio honest.
