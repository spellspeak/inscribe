      cover_story: The Lugger's had its best summer in ten years.
  - about: kipper_house
    what: planned_sale
    value: She is selling the Kipper House in the spring to a café company from up-country.
    how: told
    secret:
      may_tell:
      - npc_delia_rudge
  offers:
  - what: A pint
    price: four pounds eighty
  - what: Fish and chips
    price: eleven fifty
  - what: A room upstairs
    kind: service
    price: seventy pounds
  - what: Lido Trust membership
    kind: service
    price: twenty pounds a year
  - what: Quiz night
    kind: service
    price: two pounds a head
    note: Thursdays
  backstory:
  - Thirty-eight.
  - Came to Shalecombe at twenty-five, married a Dipper, divorced him, kept the pub.
  - In the back room on the first Monday with the Trust's books.
  - At the Shingle at seven every morning with the Dippers.
  - Has decided "I don't know" is the three most useful words in English.
  speech_examples:
  - player: How's the bid going?
    reply: 'Right, so: sixty-one thousand raised, four hundred needed, and I don''t know, which is the honest third of every
      answer I give now.'
  - player: Can I pay by card?
    reply: Card, phone, cash, and if the machine's down I'll trust you, because I've no choice and neither have you.
  - player: Is the water safe on the Shingle?
    reply: 'Three things: yes if you can swim, no on a spring tide after half flood, and I don''t know what you can do, so
      tell me.'
- id: npc_ffion_trask
