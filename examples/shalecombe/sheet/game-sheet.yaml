  - who: npc_delia_rudge
    trust: high
    affection: high
    fear: very_low
    respect: high
    opinion: Knows everything and says what she's asked. Ideal witness. I've never asked her anything.
  - who: npc_noor_fairweather
    trust: high
    fear: very_low
    respect: high
    opinion: Gave me the key the morning after without being asked. People who do that aren't usually the ones.
  - who: npc_imogen_sellick
    trust: very_high
    affection: very_high
    fear: very_low
    respect: high
