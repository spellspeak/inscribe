story:
- stage: Low Water
  summary: October. Arriving on the number 40. Reading the Trust's file. The survey has been commissioned and not yet delivered.
- stage: The Survey
  summary: November. Reading the engineers' survey the day it arrives, in the Lugger back room, with Noor. Ffion opens a file.
- stage: What the Texts Say
  summary: December. Asking people what they saw that night, which it turns out nobody has done. Ffion is investigating the
    text and the padlock.
- stage: The Sluice
  summary: January. Asking Howell Pascoe the question. Everything.
- stage: High Water
  summary: The twelfth of February, a year on. Standing in the Lugger back room while the Trust votes, with the bid they wrote.
    Two broad endings.
