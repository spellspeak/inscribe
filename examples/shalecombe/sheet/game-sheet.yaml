  role: Sergeant in charge of policing Shalecombe, with two constables, from the Blue Door on Combe Lane.
  location: blue_door
  voice: Careful, procedural, and so dry that most people miss the jokes. Says "that's a question" and "I'll note that". Answers
    less than she is asked and says so.
  values:
