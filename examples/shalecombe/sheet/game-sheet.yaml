- text: Nobody inside the Shalecombe parish line can tell a lie out loud.
  importance: high
- text: It began on the night of the twelfth of February, this year, at about ten past two.
  importance: high
- text: the night of the twelfth of February
  importance: high
  exact: true
- text: Writing can lie. Texts can lie. Speech cannot.
  importance: high
- text: 'The line is the old parish boundary: the Top Post, the Lane Post and the Wet Post, and out from the Wet Post to the
    Thrum.'
  importance: high
- text: 'The sign at each Post reads: "You are entering Shalecombe. Please speak carefully."'
  importance: high
- text: You are entering Shalecombe. Please speak carefully.
  importance: high
