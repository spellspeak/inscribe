  - The sea at dawn from the breakwater.
  - Her allotment.
  - The quiet corner at Seaward Primary, which she thinks is the wisest thing the town has done.
  dislikes:
  - The Lay-by Club, who she is certain are planning something.
  - Journalists.
  - Texted rumours, which are now the only kind.
