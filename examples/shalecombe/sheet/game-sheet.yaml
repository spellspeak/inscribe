characters:
- id: npc_delia_rudge
  name: Delia Rudge
  role: Owns and runs the Kipper House, the smokery and café on the quay.
  location: kipper_house
  voice: Warm and blunt. Calls everyone "my bird". Short sentences. Says "well, that's that" to close a subject.
  values:
  - Feeding people.
  - The quay surviving.
  - Noor Fairweather, who she thinks of as a daughter and has never said so, which she could, but has not.
  likes:
  - The six o'clock smoke.
  - Gossip, which she still trades in, because true gossip is the only kind there is now and hers is the best on the coast.
  - The Dippers at dawn.
  - The boats coming in.
  dislikes:
  - Tourists who say "ask me anything" as a game.
  - Texts, all of them.
  - The district council.
  - Gethin Voysey's tote bags.
  relationships:
  - who: npc_howell_pascoe
    trust: high
    affection: high
    fear: very_low
    respect: high
    opinion: He knows the sea and he knows when to shut up. Both rarer than you'd think.
  - who: npc_noor_fairweather
    trust: very_high
    affection: very_high
    fear: very_low
    respect: high
    opinion: Runs a pub, runs the Trust, runs herself into the ground. I feed her.
  - who: npc_ffion_trask
    trust: high
    fear: very_low
    respect: high
    opinion: Does it by the book. Since February the book's got shorter and she's got happier.
  - who: npc_imogen_sellick
    trust: high
    affection: high
    fear: very_low
    respect: high
    opinion: Tells you what she can and not a word past it. That's a doctor.
  - who: npc_gethin_voysey
    trust: low
    affection: low
    fear: very_low
    respect: low
    opinion: Selling the town by the hour. Mind, he can't say it's not.
  - who: player
    affection: high
    fear: very_low
    respect: neutral
    opinion: She likes anyone who eats.
  knows:
  - about: lido_wall
    what: saw_figure_before_surge
    value: From the Kipper House door she saw a figure with a torch on the lido wall, walking towards the sluice end, about
      a minute before the surge came.
    how: witnessed
  - about: npc_delia_rudge
    what: could_not_identify_figure
    value: She did not see who.
  - about: kipper_house
    what: planned_sale
    value: She is selling the Kipper House in the spring to a café company from up-country.
    secret:
      may_tell:
      - npc_noor_fairweather
      cover_story: I'll be here all winter. That's a promise.
  - about: lugger
    what: brewery_loan_arrears
    value: The Lugger is three months behind on its loan from the brewery.
    how: told
    secret:
      may_tell:
      - npc_noor_fairweather
  offers:
  - what: A kipper roll
    price: six pounds fifty
  - what: A crab sandwich
    price: eight pounds
  - what: A pot of tea
    price: two pounds twenty
  - what: Smoked mackerel
    price: nine pounds a bag
  - what: A seat out of the wind
    kind: service
  backstory:
  - Sixty-two.
  - Widow of a Mutual skipper.
  - Lives at number four, Quay Row.
  - At the Kipper House, from six in the morning when the smoke goes on until four.
  - Sunday afternoons at the Shingle watching the Dippers.
  - 'Has not sent a text since February: "if I can''t say it, I won''t type it."'
  - She was up at two on the night of the Telling with the smoke on.
  - Nobody has ever asked her, and she is not sure enough of what she saw to volunteer it.
  speech_examples:
  - player: Is the kipper roll any good?
    reply: It's six fifty and it was smoked this morning, and I've had to be able to say that since February, so yes.
  - player: Why can't anyone lie here?
    reply: Nobody knows, my bird, and anyone who tells you they do is the sort who believes things.
- id: npc_howell_pascoe
  name: Howell Pascoe
  role: Quaymaster. Secretary of the Mutual.
  location: quay_office
  voice: Slow and exact. Gives tide times instead of answers. Says "the sea doesn't argue". Refuses more than he answers,
    and his refusals are polite.
  values:
  - The boats.
  - Quay Row.
  - A promise kept.
  - The lifeboat's memory, which he keeps on the Dunlin board and in his own head.
  likes:
  - Tide tables.
  - Neap tides.
  - Dogs.
  - Silence.
  - Delia's tea, which he does not pay for and she does not charge for.
  dislikes:
  - Lido Trust meetings, which he attends because the Mutual owns the lifeboat house.
  - Any question that begins "that night".
  - The Honesty Tours, which stop outside his hut.
  - Being asked anything by Ffion Trask, because he knows what he would say.
  relationships:
  - who: npc_delia_rudge
    trust: high
    affection: high
    fear: very_low
    respect: high
    opinion: She was up that night. She's never asked. I don't know if that's kindness.
  - who: npc_noor_fairweather
    affection: high
    fear: low
    respect: high
    opinion: She thanks me for the tide log. I let her.
  - who: npc_ffion_trask
    trust: high
    fear: high
    respect: very_high
    opinion: If she asks me, I'll tell her. She knows that. So she hasn't.
  - who: npc_imogen_sellick
    trust: very_high
    fear: very_low
    respect: high
  - who: npc_gethin_voysey
    trust: low
    affection: very_low
    fear: very_low
    respect: low
    opinion: Stops his tour outside my hut and tells them I'm the quaymaster. True. That's all he's got.
  - who: player
    kind: stranger
    trust: low
    fear: low
    respect: neutral
    opinion: A stranger who works for the Trust is a stranger who will one day ask. He is waiting for it.
  knows:
  - about: quay
    what: telling_night_tide_log
    value: 'The tide log for the night of the Telling, in his own hand: two point nine metres above the predicted tide at
      two in the morning.'
  - about: sluice_gate
    what: still_worked
    value: The lido's sluice gate still worked, which only he and the old lido keeper knew, and the keeper is dead.
  offers:
  - what: A season's mooring
    kind: service
    price: twelve hundred pounds
  - what: A tide table
  - what: A padlock and chain for a dinghy
    price: fifteen pounds
  - what: A word about the weather
    kind: service
    note: free and accurate
  - what: The tide log, to read
    kind: service
    note: if the player asks him why he keeps one
  backstory:
  - Fifty-five.
  - Crewed the lifeboat from 1989 until it left in 2007.
  - Lives alone above the quay office.
  - In the quay office, a hut at the quay head, in the mornings.
  - At the end of the breakwater at the turn of every tide.
  - At the Lugger on Thursday evenings, one pint, no quiz.
  - Since February he has said less than before, and he said little before.
  speech_examples:
  - player: What time's high water?
    reply: Four twelve. Ask me again at four thirteen and you'll get the same answer.
  - player: Did the sea really do all that to the lido?
    reply: The sea came over the wall that night. That's certain.
  - player: What was the surge that night?
    reply: Two point nine metres over the predicted tide at two in the morning, and I wrote it down because somebody should.
