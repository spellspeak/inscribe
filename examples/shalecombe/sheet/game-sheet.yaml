  backstory:
  - Forty-four.
  - Eleven years in the town.
  - Walking the quay at eight in the morning and six in the evening.
  - On her allotment behind Seaward Primary on Sunday afternoons.
  - Nothing for sale.
  speech_examples:
  - player: Has anyone ever managed to lie here since February?
    reply: That's a question. No. And I'll note that you asked it.
  - player: Can you tell me a white lie? Just to see.
    reply: I can tell you I've tried, in April, for a bet, and lost a fiver to Dr Sellick.
