schema_version: game-sheet-0.2
game_id: brackenhythe
setting:
  kind: closed_fictional
  technology: 'It feels late medieval: timber and stone, wool and leather, barges and carts, bronze fittings and iron tools.'
  magic_policy: absent
  boundary:
    real_world: none
    allowed:
    - bronze
    - iron
    - horses
    - beer
    - bread
    - wool
    - leather
    - rope
    - carts
    - barges
    - waterwheels
    - candles of tallow
    - crossbows
    - paper and ink
    - honey
    - flour
    - eels
    - herbs
    denied:
    - phones
    - cars
    - the internet
    - gunpowder
rules:
- There is no magic.
- No spells, no blessings that work, no seeing at a distance, no reading of minds, no raising of the dead.
- Spar is a rock.
- Light and heat come from spar or from fire and tallow. There is nothing else.
- Bronze and iron are worked on the Stair.
- Horses, carts and river barges move things.
- Waterwheels grind corn.
- Crossbows exist and the Watch keeps six.
- Writing is on paper by hand; there is no press.
- Money is coin or a Reckoners' note.
- Credit is a tally-stick at the Tallyhouse.
- A debt on a stick is binding, and two missed Tallydays cost you your spar-right.
- The Chain closes the river at dusk and opens it at dawn. No exceptions, not for the Reeve, not for the Warden's seal.
- Only Hands cut spar. Only Reckoners stamp it. Fiddled spar is a crime and the Watch will take it.
- 'Healing is the leech''s trade: herbs, splints, stitches, rest. A broken arm takes six weeks. Sparflush clears in a week
  away from spar.'
- Travel is slow. Ormsgate is three days away. News is as old as the last barge.
- Anyone can speak to anyone.
- There is no nobility in the town, and the Warden is a name on a seal, not a person anyone has met.
