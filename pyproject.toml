[project]
name = "spellspeak-inscribe"
version = "0.1.0.dev0"
description = "Train a game LoRA for SpellSpeak Glyph and Sigil from your lore and character sheets"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
modal = ["modal>=1.6"]

[project.scripts]
inscribe = "inscribe.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
